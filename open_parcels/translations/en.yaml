configuration:
  log_level:
    name: Log level
    description: >-
      How much the server writes to the HA app's log. A value saved on Open Parcels' Settings page
      wins until reset there.
  public_url:
    name: Public address
    description: >-
      Where Open Parcels is reachable from outside Home Assistant (for links in the calendar
      feed), e.g. https://parcels.example.org. Leave empty if not needed. A value saved on Open
      Parcels' Settings page wins until reset there.
  quiet_window:
    name: Night-time pause
    description: >-
      Don't ask carriers for updates between midnight and 6 in the morning. A value saved on Open
      Parcels' Settings page wins until reset there.
network:
  3000/tcp: >-
    Web UI and API for clients outside Home Assistant. Set a reader password first; the
    integration does not need this port.
