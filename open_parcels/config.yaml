name: Open Parcels
version: "2.0.0-dev.20261125.3"
slug: open_parcels
description: Self-hosted parcel and order tracking for every carrier, shop and inbox.
url: https://open-parcels.github.io
# Prebuilt per version (amd64, aarch64); Home Assistant downloads it instead of building on the host.
image: bluscream1/open-parcels-ha-app
arch:
  - aarch64
  - amd64
# The web UI opens in Home Assistant's sidebar; Home Assistant logs the user in.
ingress: true
# The server hard-codes the same port (APP_INGRESS_PORT); the Dockerfile sets it too.
ingress_port: 8099
# Every ingress request is an Open Parcels admin, so only Home Assistant administrators may see the
# panel. Do not relax this.
panel_admin: true
panel_icon: mdi:package-variant-closed
panel_title: Parcels
# Optional direct access for clients outside Home Assistant, off by default.
ports:
  3000/tcp: null
# The port description lives in translations/en.yaml.
# Home Assistant restarts the app when the server stops answering (needs no open port and no auth).
watchdog: http://[HOST]:[PORT:3000]/api/v1/health/ready
# Announces the server to the Open Parcels integration (one-click setup).
discovery:
  - open_parcels
# Stop the app while Home Assistant backs it up: a copy of the live SQLite database (WAL mode) can
# miss or tear the latest writes. The pause takes seconds and the app starts again by itself.
backup: cold
# Caches refill themselves and database copies are backups already: keep them out of Home
# Assistant backups.
backup_exclude:
  - "open-parcels/images"
  - "open-parcels/tiles"
  - "open-parcels/collages"
  - "open-parcels/backups"
options:
  log_level: info
  quiet_window: true
schema:
  log_level: list(fatal|error|warn|info|debug|trace)
  public_url: url?
  quiet_window: bool
