name: Open Parcels
version: "2.0.0-dev.20261124.2"
slug: open_parcels
description: Self-hosted parcel and order tracking for every carrier, shop and mailbox.
url: https://open-parcels.github.io
# Prebuilt per version (amd64, aarch64); Home Assistant downloads it instead of building on the host.
image: bluscream1/open-parcels-ha-app
arch:
  - aarch64
  - amd64
# The web UI opens in Home Assistant's sidebar; Home Assistant signs the user in.
ingress: true
ingress_port: 8099
panel_icon: mdi:package-variant-closed
panel_title: Parcels
# Optional direct access (and the address for the Open Parcels integration), off by default.
ports:
  3000/tcp: null
ports_description:
  3000/tcp: Web UI and API outside Home Assistant (for the integration and other clients)
# Announces the server to the Open Parcels integration (one-click setup).
discovery:
  - open_parcels
startup: application
boot: auto
# Caches refill themselves and database copies are backups already: keep them out of Home
# Assistant backups.
backup_exclude:
  - "open-parcels/images"
  - "open-parcels/tiles"
  - "open-parcels/collages"
  - "open-parcels/backups"
options:
  log_level: info
  quiet_window: true
schema:
  log_level: list(fatal|error|warn|info|debug|trace)
  public_url: url?
  quiet_window: bool
